<!-- claudify plugins: packed into app.asar as .vite/build/claudify-plugins.html and loaded by
     the loader into a sandboxed window whose only bridge is window.claudify.call -->
<html><head><meta charset="utf-8"><title>claudify plugins</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src file: data:">
<style>
/* Claude's fonts from app.asar. The font stacks fall back if an update renames the files. */
@font-face { font-family:"Anthropic Serif"; font-style:normal; font-weight:300 800; src:url("../renderer/main_window/assets/AnthropicSerif-Roman-Variable-2VcCjn5t.woff2") format("woff2"); }
@font-face { font-family:"Anthropic Serif"; font-style:italic; font-weight:300 800; src:url("../renderer/main_window/assets/AnthropicSerif-Italic-Variable-Dcb-9NUS.woff2") format("woff2"); }
@font-face { font-family:"Anthropic Sans"; font-style:normal; font-weight:300 800; src:url("../renderer/main_window/assets/AnthropicSans-Roman-Variable-DDVos-BJ.woff2") format("woff2"); }
@font-face { font-family:"Anthropic Sans"; font-style:italic; font-weight:300 800; src:url("../renderer/main_window/assets/AnthropicSans-Italic-Variable-CJtkx3-S.woff2") format("woff2"); }

:root {
  --bg:#000; --surface-1:#0d0d0d; --surface-3:#151515; --border:#262626;
  --dim:#a6a6a6; --muted:#c8c8c8; --text:#fff;
  /* paintLook repaints these from the Claudify Theme settings, or uses Claude's brand color when the theme is off */
  --accent:#d97757; --accent-rgb:217 119 87; --on-accent:#000;
  --bad:#f85149; --bad-rgb:248 81 73;
  --plate:rgb(255 255 255 / .07); --plate-strong:rgb(255 255 255 / .12);
  /* outline of inputs and swatches: follows the text color so it shows on any background */
  --ctl-line:color-mix(in srgb, var(--text) 28%, transparent);
  --btn-r:8px; --r-sm:6px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(.2,.7,.3,1); --fb:160ms; --press:90ms;
  --elev-2:0 2px 6px rgb(0 0 0 / .55), 0 18px 48px rgb(0 0 0 / .45);
  --serif:"Anthropic Serif", "Noto Serif", Georgia, serif;
  --ui:"Anthropic Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; display:grid; grid-template-columns:216px 1fr; background:var(--bg); color:var(--text); font:500 13px/1.5 var(--ui); -webkit-font-smoothing:antialiased; overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
input, select, textarea { font:inherit; color:inherit; }
::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:10px; border:3px solid transparent; background-clip:padding-box; }
::placeholder { color:var(--dim); font-style:italic; opacity:1; }

/* controls */
.btn { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px; border-radius:var(--btn-r); background:var(--plate); color:var(--muted); white-space:nowrap; transition:background var(--fb), color var(--fb); }
.btn:hover { background:var(--plate-strong); color:var(--text); }
.btn.primary { background:var(--text); color:var(--bg); } .btn.primary:hover { background:color-mix(in srgb, var(--text) 88%, var(--bg)); color:var(--bg); }
.btn.tint { background:rgb(var(--accent-rgb) / .16); color:var(--text); } .btn.tint:hover { background:rgb(var(--accent-rgb) / .24); }
.btn.sm { height:28px; padding:0 10px; }
.ibtn { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:var(--btn-r); background:var(--plate); color:var(--muted); flex:none; transition:background var(--fb), color var(--fb); }
.ibtn.lg { width:34px; height:34px; }
.ibtn.ghost { background:none; } .ibtn:hover { background:var(--plate-strong); color:var(--text); }
.ibtn[data-armed] { background:rgb(var(--bad-rgb) / .16); color:var(--bad); box-shadow:inset 0 0 0 1px rgb(var(--bad-rgb) / .5); }
:is(.btn, .ibtn, .nav-item, .tab, .seg button):active { scale:.985; transition:scale var(--press); }

/* rail */
nav { display:flex; flex-direction:column; padding:22px 14px 16px; gap:3px; }
.brand { font:400 21px/1 var(--serif); letter-spacing:0; padding:2px 10px 26px; color:var(--text); }
.brand i { color:var(--dim); }
.nav-list { position:relative; display:flex; flex-direction:column; gap:3px; }
.nav-item { position:relative; display:flex; align-items:center; gap:10px; height:34px; padding:0 10px; border-radius:var(--btn-r); color:var(--dim); text-align:left; width:100%; transition:background var(--fb), color var(--fb); }
.nav-item:hover { background:var(--plate); color:var(--text); }
.nav-item.active { background:var(--plate); color:var(--text); }
.nav-item .count { margin-left:auto; font:11.5px var(--mono); font-variant-numeric:tabular-nums; color:var(--dim); }
.selbar { position:absolute; left:0; width:2px; height:18px; border-radius:2px; background:var(--accent); pointer-events:none; transition:top 320ms var(--ease), opacity var(--fb); }
.rail-foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
.hint { color:var(--dim); font-size:12px; font-style:italic; padding:0 10px; white-space:nowrap; }
kbd { font:500 11px var(--mono); font-style:normal; background:var(--plate); border-radius:var(--r-sm); padding:1px 5px; color:var(--muted); }

/* main + the dotted ground */
main { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; }
#dots { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.top, .content { position:relative; }
.top { display:flex; align-items:center; gap:8px; padding:22px 30px 18px; min-height:78px; }
.top h1 { font:400 23px/1.1 var(--serif); margin:0; }
.top h1 i { color:var(--accent); }
.sp { flex:1; }
.content { flex:1; overflow:auto; scrollbar-gutter:stable; padding:4px 30px 30px; }

/* cards */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; }
.card { position:relative; overflow:hidden; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; cursor:pointer; min-height:150px; transition:background var(--fb), border-color var(--fb), translate 240ms var(--ease), opacity var(--fb); }
.card:hover { background:var(--surface-3); border-color:color-mix(in srgb, var(--border), var(--text) 14%); translate:0 -2px; }
.card.off { opacity:.5; } .card.off:hover { opacity:.75; }
.edge::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--edge); }
.edge.pending { --edge:var(--accent); } .edge.error { --edge:var(--bad); }
.card-head { display:flex; align-items:center; gap:12px; }
.glyph { width:34px; height:34px; border-radius:var(--btn-r); display:grid; place-items:center; flex:none; background:var(--plate); color:var(--muted); }
.card-title { font:400 16px/1.25 var(--serif); }
.card-file { color:var(--dim); font:11.5px var(--mono); }
.card-desc { color:var(--muted); font:400 14px/1.5 var(--serif); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-desc.none { color:var(--dim); font-style:italic; }
.meta-row { margin-top:auto; display:flex; align-items:center; gap:14px; color:var(--dim); font:11.5px var(--mono); font-variant-numeric:tabular-nums; }
.meta-row span { display:inline-flex; align-items:center; gap:5px; }
.meta-row .mark { color:var(--accent); } .meta-row .mark.bad { color:var(--bad); }

/* switch */
.switch { position:relative; width:30px; height:16px; border-radius:16px; background:var(--plate-strong); flex:none; transition:background 200ms var(--ease); }
.switch:hover { background:color-mix(in srgb, var(--text) 18%, transparent); }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--text); transition:translate 200ms var(--ease), background 200ms; }
.switch.on { background:var(--accent); } .switch.on::after { translate:14px 0; background:var(--on-accent); }

/* detail */
.detail { max-width:880px; }
.hero { display:flex; align-items:center; gap:14px; margin:0 0 14px; }
.hero .glyph { width:44px; height:44px; }
.hero h2 { margin:0; font:400 24px/1.2 var(--serif); }
.hero .meta { color:var(--dim); font:11.5px var(--mono); margin-top:3px; }
.hero .actions { margin-left:auto; display:flex; gap:10px; align-items:center; }
.desc { color:var(--muted); font:400 15px/1.6 var(--serif); margin:0 0 20px; max-width:62ch; }
.notice { position:relative; overflow:hidden; display:flex; gap:12px; align-items:center; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 14px 12px 17px; margin-bottom:14px; color:var(--muted); }
.notice .glyphmark { color:var(--edge); display:grid; }
.notice b { color:var(--text); font-weight:500; }
.notice .why { color:var(--dim); font-size:12.5px; }
.tabs { position:relative; display:flex; align-items:center; gap:4px; margin-bottom:16px; }
.tab { position:relative; height:28px; padding:0 12px; border-radius:var(--btn-r); color:var(--dim); transition:background var(--fb), color var(--fb); }
.tab:hover { background:var(--plate); color:var(--text); }
.tab.active { background:var(--plate); color:var(--text); }
.tabbar { position:absolute; bottom:-6px; height:2px; border-radius:2px; background:var(--accent); pointer-events:none; transition:left 320ms var(--ease), width 320ms var(--ease); }
.panel { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg); padding:8px; }
.row { display:grid; grid-template-columns:1fr minmax(220px, 320px); gap:20px; align-items:center; min-height:48px; padding:6px 10px; }
.row .label { color:var(--muted); }
.ctl { display:flex; align-items:center; gap:10px; justify-content:flex-end; }
input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:4px; outline:none; cursor:pointer;
  background:linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 0%) 100% no-repeat, var(--plate-strong); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--text); transition:scale var(--fb); }
input[type=range]:hover::-webkit-slider-thumb { scale:1.15; }
.val { min-width:62px; text-align:right; font:12px var(--mono); font-variant-numeric:tabular-nums; color:var(--dim); }
.field { background:var(--bg); border:1px solid var(--ctl-line); border-radius:var(--btn-r); height:30px; padding:0 10px; outline:none; width:100%; transition:border-color var(--fb); }
.field:focus { border-color:var(--accent); }
.group { display:flex; align-items:center; gap:12px; justify-content:space-between; min-height:30px; padding:18px 10px 4px; font:italic 15px var(--serif); color:var(--text); }
.group .ctl { flex:none; }
/* rows that depend on another setting fold away instead of vanishing */
.fold { display:grid; grid-template-rows:1fr; transition:grid-template-rows 420ms var(--ease), opacity 420ms var(--ease); }
.fold > div { min-height:0; overflow:hidden; }
.fold.shut { grid-template-rows:0fr; opacity:0; }
.row.sub { min-height:0; padding-top:0; padding-bottom:10px; }
.row.sub .label { display:flex; align-items:center; gap:12px; padding-left:14px; color:var(--dim); }
.stage { width:44px; height:44px; flex:none; border-radius:var(--btn-r); background:var(--bg) center / 100% no-repeat; box-shadow:inset 0 0 0 1px var(--border); transition:background-size 120ms var(--ease); }
.picker { display:flex; align-items:center; gap:16px; margin:0 10px 12px 24px; padding:12px; border-radius:var(--r-md); background:var(--plate); }
.picker canvas { width:88px; height:88px; flex:none; object-fit:contain; border-radius:var(--btn-r); background:var(--bg); box-shadow:inset 0 0 0 1px var(--border); image-rendering:pixelated; }
.picker .pick-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
.picker .pick-line { display:flex; align-items:center; gap:10px; }
.group:first-child { padding-top:8px; }
.thumb { width:30px; height:30px; border-radius:var(--btn-r); background:var(--bg) center / contain no-repeat; box-shadow:inset 0 0 0 1px var(--border); display:grid; place-items:center; flex:none; color:var(--dim); font:10px var(--mono); text-transform:uppercase; }
.fname.none { font:italic 13px var(--serif); }
.fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px var(--mono); color:var(--dim); text-align:right; }
.swatch { position:relative; width:30px; height:30px; border-radius:var(--btn-r); box-shadow:inset 0 0 0 1px var(--ctl-line); overflow:hidden; flex:none; cursor:pointer; }
.swatch input { position:absolute; inset:-8px; width:46px; height:46px; border:0; padding:0; cursor:pointer; opacity:0; }
.hex { width:96px; font:12px var(--mono); }
.seg { display:flex; background:var(--plate); border-radius:var(--btn-r); padding:2px; gap:2px; flex-wrap:wrap; justify-content:flex-end; }
.seg button { height:26px; padding:0 10px; border-radius:var(--r-sm); color:var(--dim); transition:background var(--fb), color var(--fb); }
.seg button:hover { color:var(--text); }
.seg button.on { background:var(--plate-strong); color:var(--text); }
select.field { cursor:pointer; }
.empty { text-align:center; color:var(--dim); padding:64px 24px; font:italic 400 15px/1.6 var(--serif); }
.empty h3 { color:var(--text); margin:12px 0 4px; font:400 19px var(--serif); font-style:normal; }
.empty .glyphmark { color:var(--dim); display:inline-grid; }
.empty pre { text-align:left; display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; font:12px/1.7 var(--mono); font-style:normal; color:var(--muted); margin-top:14px; }
.editor-bar { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.foot { color:var(--dim); font-size:12px; font-style:italic; }
textarea.code { width:100%; min-height:420px; height:calc(100vh - 350px); resize:vertical; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-md); padding:14px 16px; font:12.5px/1.65 var(--mono); color:#dcdcdc; outline:none; tab-size:2; white-space:pre; direction:ltr; transition:border-color var(--fb); }
textarea.code:focus { border-color:rgb(var(--accent-rgb) / .6); }
.log { white-space:pre-wrap; font:12px/1.7 var(--mono); color:var(--muted); padding:10px 12px; margin:0; word-break:break-all; }
.toast { position:fixed; right:22px; bottom:22px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 14px; box-shadow:var(--elev-2); translate:0 5px; opacity:0; transition:opacity 340ms var(--ease), translate 340ms var(--ease); pointer-events:none; }
.toast.show { translate:0 0; opacity:1; } .toast.bad { color:var(--bad); }

/* entrance animation, staggered */
@keyframes rise { from { opacity:0; translate:0 5px; } }
.enter { animation:rise 420ms var(--ease) both; animation-delay:min(calc(var(--i, 0) * 70ms), 700ms); }

/* icon hover animations */
.ic { transition:rotate 700ms var(--ease), translate 300ms var(--ease), scale 300ms var(--ease); }
@keyframes ic-shake { 25% { rotate:-10deg; } 50% { rotate:9deg; } 75% { rotate:-4deg; } }
@keyframes ic-hop { 30% { translate:0 -3px; } 60% { translate:0 0; } 80% { translate:0 -2px; } }
@keyframes ic-code { 30% { translate:-2px 0; } 70% { translate:2px 0; } }
@keyframes ic-pop { 50% { scale:1.2; } }
@media (prefers-reduced-motion:no-preference) {
  :is(button, label):hover .ic-refresh { rotate:360deg; }

  :is(button, label):hover :is(.ic-download, .ic-upload) { animation:ic-hop 600ms var(--ease); }
  :is(button, label, .card):hover .ic-brush { animation:ic-shake 700ms var(--ease); }
  :is(button, label, .card):hover .ic-code { animation:ic-code 500ms var(--ease); }
  :is(button, label):hover .ic-trash { animation:ic-shake 500ms var(--ease); }
  :is(button, label):hover .ic-check { animation:ic-pop 400ms var(--ease); }
  :is(button, label):hover .ic-grid { rotate:90deg; }
  :is(button, label):hover .ic-activity { animation:ic-code 600ms var(--ease); }
}
@media (prefers-reduced-motion:reduce) { .enter { animation:none; } * { transition:none !important; } }

      if (small) return run(() => api("setFile", p.kind, p.file, s.key, small.name, small.url).then(clearSource), `Using ${f.name}, shrunk to fit`);
      const r = new FileReader();
      r.onload = () => run(() => api("setFile", p.kind, p.file, s.key, f.name, r.result).then(clearSource), `Using ${f.name}`);
      r.readAsDataURL(f);
    } });
    return h("div", { class: "ctl" },
      h("span", { class: "fname" + (s.value ? "" : " none"), title: s.value }, s.value ? fileLabel(p, s) : s.empty || "None"),
      s.value && h("span", { class: "thumb", style: s.preview ? `background-image:url("${s.preview}")` : "" }, !s.preview && ext.slice(0, 4)),
      h("button", { class: "btn sm", onclick: () => pick.click() }, ico("file", 14), s.value ? "Replace" : "Choose", pick),
      s.value && h("button", { class: "ibtn", "aria-label": "Remove", title: "Remove", onclick: () => set("").then(clearSource).then(refresh) }, ico("x", 14)));
  }
  return h("div", { class: "ctl" }, h("input", { class: "field", value: s.value, onchange: (e) => set(e.target.value) }));
};

const TEMPLATES = {
  css: `/*
 * @name My style
 * @description What this changes.
 * @setting accent color #d97757 "Accent color"
 * @setting radius range 12 "Corner radius" min=0 max=24 step=1 unit=px
 * @setting compact toggle false "Compact spacing"
 */
:root {
  --cds-clay: {{accent}} !important;
  --cds-radius: {{radius}}px !important;
}
/* @if compact */
/* rules that only apply while "Compact spacing" is on */
/* @endif */
`,
  js: `// @name My script
// @description What this does.
// @match ^https://claude\\.ai/
// @setting greeting text "Hello" "Greeting"
// Runs in the page. \`settings\` holds this plugin's values; return a cleanup
// function so it can be switched off or updated without a reload.
const note = document.createElement("div");
note.textContent = settings.greeting;
return () => note.remove();
`,
};

// if=, for= and a group's toggle= decide which rows are open; changing a value re-folds in place
const settingsPanel = (p) => {
  const byKey = (k) => p.settings.find((s) => s.key === k);
  const on = (x) => x !== false && x !== "" && x !== 0 && x != null;
  const holds = (v, c) => { const m = /^([\w-]+)(!?=)(.*)$/.exec(c); return m ? (String(v[m[1]]) === m[3]) === (m[2] === "=") : on(v[c]); };
  const shown = (s, v) => (!s.if || s.if.split("&").every((c) => holds(v, c)))
    && (!s.groupToggle || s.key === s.groupToggle || on(v[s.groupToggle]))
    && (!s.for || (on(v[s.for]) && shown(byKey(s.for), v)));
  const folds = [];
  const fold = (test, ...kids) => { const f = h("div", { class: "fold" }, h("div", {}, ...kids)); folds.push([f, test]); return f; };
  const sync = () => {
    const v = Object.fromEntries(p.settings.map((s) => [s.key, s.value]));
    for (const [f, test] of folds) { const open = test(v); f.classList.toggle("shut", !open); f.inert = !open; }
  };
  const rows = [];
  p.settings.forEach((s, i) => {
    if (s.group && s.group !== p.settings[i - 1]?.group) {
      const t = s.groupToggle && byKey(s.groupToggle);
      rows.push(h("div", { class: "group" }, h("span", {}, s.group), t?.type === "toggle" && ctlFor(p, t, sync)));
    }
    if (s.for || s.hidden || (s.groupToggle === s.key && s.type === "toggle")) return;
    const ctl = ctlFor(p, s, sync);
    let picking = false, picker = null;
    if (s.type === "file" && s.share && s.preview) {
      ctl.querySelector(".btn").before(h("button", { class: "ibtn", "aria-label": "Use for every state", title: "Use for every state", onclick: () => shareFile(p, s) }, ico("layers", 15)));
    }
    // the frame picker only once this slot holds an animation (or a frame cut from one)
    if (s.type === "file" && s.frames && [s, byKey(s.source)].some((x) => ANIMATED.test(x?.preview || ""))) {
      ctl.querySelector(".btn").before(h("button", { class: "ibtn", "aria-label": "Use one frame of an animation", title: "Use one frame of an animation", onclick: () => {
        picking = !picking;
        if (picking && !picker.firstChild.firstChild) picker.firstChild.append(framePicker(p, s));
        sync();
      } }, ico("film", 15)));
    }
    rows.push(fold((v) => shown(s, v), h("div", { class: "row" }, h("div", { class: "label" }, s.label), ctl)));
    if (s.type !== "file") return;
    if (s.frames) rows.push(picker = fold((v) => picking && shown(s, v)));
    const size = p.settings.find((x) => x.for === s.key && x.type === "range");
    if (size && s.preview) { ctl.querySelector(".thumb")?.remove(); rows.push(fold((v) => shown(size, v), sizer(p, s, size))); }
  });
  sync();
  return h("div", { class: "panel" }, rows);
};

async function renderDetail() {
  const v = view, c = document.getElementById("content"), enter = entering;
  const p = v.isNew ? { kind: v.kind, file: "", name: v.kind === "js" ? "New script" : "New style", description: "", settings: [], on: true }
    : S.plugins.find((x) => x.file === v.file && x.kind === v.kind);
  if (!p) { view = { page: "installed" }; return render(); }
  const kind = p.kind;
  const back = h("button", { class: "ibtn lg", "aria-label": "Back", title: "Back", onclick: () => go({ page: "installed" }) }, ico("back", 17));
  document.getElementById("top").replaceChildren(back);
  const src = v.isNew ? (v.draft ?? TEMPLATES[kind]) : await api("read", p.kind, p.file);
  if (view !== v) return; // navigated away while loading

  const nameIn = v.isNew && h("input", { class: "field", style: "width:240px;height:34px", placeholder: kind === "js" ? "file-name.js…" : "file-name.css…", value: v.name || "" });
  const actions = h("div", { class: "actions" },
    !v.isNew && toggle(p),
    !v.isNew && h("button", { class: "ibtn lg", "aria-label": "Export", title: "Export with your settings", onclick: () =>
      run(() => api("export", p.kind, p.file).then((to) => to && toast(`Exported to ${to.replace(/^\/home\/[^/]+/, "~")}`))) }, ico("upload", 16)),
    !v.isNew && (() => { const b = h("button", { class: "ibtn lg", "aria-label": "Delete", title: "Delete", onclick: () => {
      if (b.dataset.armed) return run(() => api("remove", p.kind, p.file).then(() => { dirty = false; view = { page: "installed" }; entering = true; }), `Deleted ${p.name}`);
      b.dataset.armed = "1"; b.title = "Click again to delete"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.title = "Delete"; } }, 3000);
    } }, ico("trash", 16)); return b; })());

  const hero = h("div", { class: "hero" }, glyphFor(kind),
    h("div", {}, v.isNew ? nameIn : h("h2", {}, p.name), h("div", { class: "meta" }, [p.file, p.author && "by " + p.author, p.version && "v" + p.version].filter(Boolean).join(" · "))),
    actions);
  const notice = (tone, icon, ...kids) => h("div", { class: "notice edge " + tone }, h("span", { class: "glyphmark", html: svg(icon, 18) }), ...kids);
  const notices = [
    p.error && notice("error", "alert", h("div", {}, h("b", {}, "Last run failed"), h("div", { class: "why" }, p.error))),
    p.needsReload && notice("pending", "refresh", h("div", {}, h("b", {}, "Reload to finish"), h("div", { class: "why" }, "The old version had no cleanup function and is still active.")),
      h("span", { class: "sp" }), h("button", { class: "btn sm", onclick: () => run(() => api("reloadClaude")) }, "Reload Claude")),
  ];

  const tabs = v.isNew ? [] : [["settings", "Settings"], ["code", kind === "js" ? "Script" : "Stylesheet"]];
  const tabBar = tabs.length && h("div", { class: "tabs" }, tabs.map(([id, label]) => h("button", { class: "tab" + (v.tab === id ? " active" : ""), onclick: () => { if (v.tab !== id && guard()) { dirty = false; view = { ...v, tab: id }; render(); } } }, label)),
    h("span", { class: "sp" }),
    v.tab === "settings" && p.settings.length > 0 && h("button", { class: "ibtn", "aria-label": "Reset to defaults", title: "Reset to defaults", onclick: () => run(() => api("resetSettings", p.kind, p.file).then(() => { quietUntil = 0; }), "Reset to defaults") }, ico("reset", 15)));

  let body;
  if (v.tab === "settings" && !v.isNew) {
    body = p.settings.length
      ? settingsPanel(p)
      : h("div", { class: "panel empty" }, h("span", { class: "glyphmark", html: svg("sliders", 28) }), h("h3", {}, "No settings"),
          "Add controls with @setting lines in the header", h("br"),
          h("pre", {}, `@setting accent color #d97757 "Accent color"\n@setting size range 16 "Text size" min=12 max=22 unit=px\n@setting layout select wide "Layout" options=narrow:Narrow|wide:Wide\n@setting glow toggle true "Glow"\n@setting title text "Hi" "Title"`));
  } else {
    const ta = h("textarea", { class: "code", spellcheck: false, value: src });
    ta.addEventListener("input", () => { dirty = true; if (v.isNew) v.draft = ta.value; });
    ta.addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); dirty = true; } });
    const save = async () => {
      const name = v.isNew ? nameIn.value.trim() : p.file;
      if (!name) { nameIn.focus(); return toast("Give it a file name", true); }
      await run(async () => { const f = await api("save", kind, name, ta.value); dirty = false; view = { page: "detail", kind, file: f, tab: "code" }; }, "Saved");
    };
    window.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } };
    body = h("div", {},
      h("div", { class: "editor-bar" }, h("span", { class: "foot" }, kind === "js" || p.script ? "Scripts rerun the moment you save." : "Styles apply the moment you save."), h("span", { class: "sp" }),
        h("kbd", {}, "Ctrl S"), h("button", { class: "btn primary sm", onclick: save }, ico("check", 14), "Save")),
      ta);
  }
  const parts = [hero, p.description && h("div", { class: "desc" }, p.description), ...notices.filter(Boolean), tabBar, body].filter(Boolean);
  if (enter) parts.forEach((el, i) => { el.classList.add("enter"); el.style.setProperty("--i", i); });
  c.replaceChildren(h("div", { class: "detail" }, ...parts));
  if (tabBar) { tabBar.append(tabMarker); slide(tabMarker, tabBar.querySelector(".tab.active"), true); }
}

window.claudify.onChange(() => {
  paintLook();
  if (!dirty && Date.now() > quietUntil) refresh();
  else api("state").then((s) => { S = s; renderNav(); });
});
paintLook();
refresh();
</script></body></html>
